baseURL = 'https://scouting.university/'
locale = 'en-us'
title = 'Scouting University'
enableRobots = true
disableKinds = ['taxonomy', 'term']

[outputs]
  home = ['html', 'rss', 'robots']

[module]
  [[module.imports]]
    path = "github.com/markgoho/uni-theme"

[params.analytics]
  pirsch_code = '3ghEJ8dNoUUjtbQI3smz4RUa5LeYQyfY'

[params.imagekit]
  # Shared ImageKit account also used by mbu and doula.coop. Object paths
  # are prefixed /su-assets/ so they never collide with those sites' own
  # folders. See docs/adr for the image delivery decision record.
  endpoint = 'https://ik.imagekit.io/doulacoop'
  widths   = [400, 600, 800, 1200, 1600]

[params.theme]
  siteTitle = 'Scouting University'
  siteTitleShort = 'Scouting U'
  tagline = 'Your guide to Scouts BSA rank requirements.'
  hideReqChildTitles = true
  guideLabel = 'Digital Requirements Guide'

  [params.theme.cta]
    label = 'Browse Ranks'
    href = '/scouts-bsa/ranks/'

  [[params.theme.footerColumns]]
    title = 'Ranks'
    [[params.theme.footerColumns.links]]
      label = 'All Ranks'
      href = '/scouts-bsa/ranks/'

  [[params.theme.footerColumns]]
    title = 'Resources'
    [[params.theme.footerColumns.links]]
      label = 'Search'
      href = '/search/'

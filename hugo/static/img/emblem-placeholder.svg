<!--
  Neutral slot-filler for the search result emblem rail (uni-theme#16).

  Passed to uni-theme's search/page.html as `emblemPlaceholder`, so it is
  a render-time fallback only: it is never written into the Pagefind
  index as an `image[src]` meta. That keeps the has-emblem / no-emblem
  distinction intact, so real rank emblem art can be backfilled per rank
  later without touching this file.

  Deliberately plain: a grey outline, not a design. The theme renders it
  at 0.5 opacity via .award-result__emblem-placeholder.

  Note for editors: this is parsed as XML, so a comment may not contain
  two consecutive hyphens.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
  <circle cx="32" cy="32" r="26" fill="none" stroke="#8a8a8a" stroke-width="2" />
  <circle cx="32" cy="32" r="10" fill="none" stroke="#8a8a8a" stroke-width="2" />
</svg>

<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers scouting-u#28: what does a stylized rank
  identity look like once we've ruled out official BSA emblem imagery
  (decision on #27, ADR 0003)? Three structurally different marks, each
  shown at the four sizes it would actually appear at: ladder node
  (home page rail), landing hero (rank landing page), breadcrumb/nav
  (tiny inline), and search result card (small inline).

  Deliberately OUTSIDE hugo/ — nothing here is wired to real routes or
  indexed by Pagefind. Open directly in a browser, no server needed.

  Self-check per rank (#28's ask): none of the three variants use a
  circular rope-bordered patch outline, a diamond/lozenge outline, or a
  fleur-de-lis — the three visual signatures most associated with real
  BSA rank badges. Each variant's own note below says what shape family
  it leans on instead.

  Delete this file once #28 is resolved and captured (branch
  prototype/28-rank-identity per the repo's convention — see #23).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROTOTYPE — rank identity (#28)</title>
    <style>
      /* TOKENS: lifted from uni-theme colors.css :root (v1) — approximate
         subset only, enough to judge structure, not pixel-exact reuse. */
      :root {
        --surface: hsl(41, 23%, 94%);
        --surface-raised: hsl(41, 23%, 97%);
        --surface-sunken: hsl(41, 23%, 88%);
        --on-surface: hsl(138, 27%, 19%);
        --on-surface-muted: hsl(41, 23%, 45%);
        --accent: hsl(138, 27%, 19%);
        --outline: hsl(41, 23%, 69%);
        --outline-variant: hsl(41, 23%, 79%);
        --font-display: "Literata", Georgia, serif;
        --font-body: "Inter", system-ui, -apple-system, sans-serif;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --space-2xs: 0.25rem;
        --space-xs: 0.5rem;
        --space-s: 0.75rem;
        --space-m: 1rem;
        --space-l: 1.5rem;
        --space-xl: 2rem;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--surface);
        color: var(--on-surface);
        font-family: var(--font-body);
        padding-bottom: 6rem;
      }
      .proto-banner {
        background: var(--on-surface);
        color: var(--surface-raised);
        font-size: 0.8rem;
        padding: var(--space-s) var(--space-m);
        text-align: center;
      }
      .proto-banner code {
        background: rgba(255, 255, 255, 0.15);
        padding: 0.1em 0.35em;
        border-radius: 3px;
      }
      main {
        max-width: 64rem;
        margin: 0 auto;
        padding: var(--space-xl) var(--space-m);
      }
      .variant-note {
        max-width: 42rem;
        margin: 0 auto var(--space-l);
        text-align: center;
        color: var(--on-surface-muted);
        font-size: 0.95rem;
      }
      .variant-title {
        text-align: center;
        font-family: var(--font-display);
        font-size: 1.6rem;
        margin: 0 0 var(--space-2xs);
      }
      .context-block {
        margin-bottom: var(--space-xl);
      }
      .context-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--on-surface-muted);
        margin: 0 0 var(--space-s);
        text-align: center;
      }
      .rank-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: var(--space-l);
        align-items: flex-end;
      }
      .rank-cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-2xs);
      }
      .rank-cell .rank-name {
        font-size: 0.7rem;
        color: var(--on-surface-muted);
      }
      /* ---- switcher bar (same mechanism as #23's prototype) ---- */
      .switcher {
        position: fixed;
        bottom: var(--space-l);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: var(--space-s);
        background: var(--on-surface);
        color: var(--surface-raised);
        padding: var(--space-xs) var(--space-m);
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        font-size: 0.85rem;
        z-index: 100;
      }
      .switcher button.arrow {
        background: none;
        border: none;
        color: inherit;
        font-size: 1.1rem;
        cursor: pointer;
        padding: 0 var(--space-2xs);
      }
      .switcher button.arrow:hover {
        opacity: 0.7;
      }
      .switcher .label {
        min-width: 14rem;
        text-align: center;
      }

      /* ---- mark shapes, shared sizing hook ---- */
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-weight: 600;
        flex-shrink: 0;
      }
      /* A — numeral medallion: open ring, numeral only. */
      .mark--a {
        border-radius: 50%;
        border-style: solid;
        background: var(--surface-raised);
      }
      /* B — chevron stack: rounded tile, count-of-level chevrons. */
      .mark--b {
        border-radius: 22%;
        background: var(--surface-raised);
        border: 1.5px solid var(--outline-variant);
      }
      .mark--b .chevron-stack {
        display: flex;
        flex-direction: column-reverse;
        align-items: center;
      }
      .mark--b .chevron-stack span {
        display: block;
        line-height: 0.55;
      }
      /* C — hex monogram: clipped hexagon, filled, monogram + level chip. */
      .mark--c {
        clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%);
        position: relative;
        color: var(--surface-raised);
        letter-spacing: 0.03em;
      }
      .mark--c .level-chip {
        position: absolute;
        top: -0.35em;
        right: -0.35em;
        background: var(--on-surface);
        color: var(--surface-raised);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-body);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="proto-banner">
      PROTOTYPE for <code>scouting-u#28</code> — cycle variants with the
      arrows below or <code>?variant=a|b|c</code>. Not production code.
    </div>
    <main>
      <h1 class="variant-title" id="variant-title"></h1>
      <p class="variant-note" id="variant-note"></p>
      <div id="content"></div>
    </main>

    <div class="switcher">
      <button class="arrow" id="prev" aria-label="Previous variant">&larr;</button>
      <span class="label" id="switcher-label"></span>
      <button class="arrow" id="next" aria-label="Next variant">&rarr;</button>
    </div>

    <script>
      /* Rank data: level + short label, seven Scouts BSA ranks in order. */
      const RANKS = [
        { level: 1, short: "Scout", initials: "SC" },
        { level: 2, short: "Tenderfoot", initials: "TF" },
        { level: 3, short: "Second Class", initials: "2C" },
        { level: 4, short: "First Class", initials: "1C" },
        { level: 5, short: "Star", initials: "ST" },
        { level: 6, short: "Life", initials: "LI" },
        { level: 7, short: "Eagle", initials: "EA" },
      ];

      /* Deeper olive as level climbs — same "growth" read all three
         variants share, so color isn't what's being compared. */
      function markColor(level) {
        const lightness = 60 - level * 4; // 56% .. 32%
        return `hsl(138, 27%, ${lightness}%)`;
      }

      const CONTEXTS = [
        { key: "ladder", label: "Ladder node — home page rail", size: 56, showName: true },
        { key: "hero", label: "Landing hero — rank page", size: 128, showName: true },
        { key: "breadcrumb", label: "Breadcrumb / nav — inline", size: 22, showName: false },
        { key: "search", label: "Search result card — inline", size: 30, showName: false },
      ];

      function markA(rank, size) {
        const color = markColor(rank.level);
        const ring = Math.max(2, Math.round(size * 0.035));
        const fontSize = Math.round(size * 0.42);
        return `<span class="mark mark--a" style="width:${size}px;height:${size}px;border-width:${ring}px;border-color:${color};color:${color};font-size:${fontSize}px">${rank.level}</span>`;
      }

      function markB(rank, size) {
        const color = markColor(rank.level);
        const chevronSize = Math.round(size * 0.34);
        const chevrons = Array.from({ length: rank.level })
          .map(() => `<span style="font-size:${chevronSize}px;color:${color}">&#8963;</span>`)
          .join("");
        return `<span class="mark mark--b" style="width:${size}px;height:${size}px;padding:${Math.round(size * 0.14)}px 0"><span class="chevron-stack">${chevrons}</span></span>`;
      }

      function markC(rank, size) {
        const color = markColor(rank.level);
        const fontSize = Math.round(size * 0.3);
        const chipSize = Math.round(size * 0.34);
        return `<span class="mark mark--c" style="width:${size}px;height:${size}px;background:${color};font-size:${fontSize}px">${rank.initials}<span class="level-chip" style="width:${chipSize}px;height:${chipSize}px;font-size:${Math.round(chipSize * 0.6)}px">${rank.level}</span></span>`;
      }

      const VARIANTS = {
        a: {
          name: "A — Numeral medallion",
          note: "Pure typography: an open ring holding the level numeral, deepening in color with rank. No icon geometry at all. Self-check: an open ring reads as a plain frame, not a rope-bordered patch outline.",
          mark: markA,
        },
        b: {
          name: "B — Chevron stack",
          note: "Abstract geometric: a rounded tile holding one stacked chevron per level (1 for Scout, 7 for Eagle) — count carries the progression, not a numeral. Self-check: chevrons read as service-stripe insignia, a shape family with no BSA rank-badge association.",
          mark: markB,
        },
        c: {
          name: "C — Hex monogram",
          note: "Hybrid: a filled hexagon with a two-letter monogram, level numeral as a corner chip. Self-check: hexagon avoids both the diamond/lozenge outline and the fleur-de-lis BSA uses on several real rank badges.",
          mark: markC,
        },
      };

      const variantKeys = Object.keys(VARIANTS);

      function render(variantKey) {
        const v = VARIANTS[variantKey];
        document.getElementById("variant-title").textContent = v.name;
        document.getElementById("variant-note").textContent = v.note;
        document.getElementById("content").innerHTML = CONTEXTS.map(
          (ctx) => `
          <div class="context-block">
            <p class="context-label">${ctx.label}</p>
            <div class="rank-row">
              ${RANKS.map(
                (rank) => `
                <div class="rank-cell">
                  ${v.mark(rank, ctx.size)}
                  ${ctx.showName ? `<span class="rank-name">${rank.short}</span>` : ""}
                </div>`
              ).join("")}
            </div>
          </div>`
        ).join("");
        document.getElementById("switcher-label").textContent = `${variantKey.toUpperCase()} — ${v.name.split(" — ")[1]}`;
      }

      function currentVariant() {
        const v = new URLSearchParams(location.search).get("variant");
        return variantKeys.includes(v) ? v : "a";
      }

      function setVariant(key) {
        const url = new URL(location.href);
        url.searchParams.set("variant", key);
        history.replaceState(null, "", url);
        render(key);
      }

      function cycle(delta) {
        const i = variantKeys.indexOf(currentVariant());
        setVariant(variantKeys[(i + delta + variantKeys.length) % variantKeys.length]);
      }

      document.getElementById("prev").addEventListener("click", () => cycle(-1));
      document.getElementById("next").addEventListener("click", () => cycle(1));
      document.addEventListener("keydown", (e) => {
        const tag = document.activeElement.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement.isContentEditable) return;
        if (e.key === "ArrowLeft") cycle(-1);
        if (e.key === "ArrowRight") cycle(1);
      });

      render(currentVariant());
    </script>
  </body>
</html>
